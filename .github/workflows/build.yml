# Builds default.xbe and runs the host tests. No game data is involved: the
# XBE reads the user's own disc image at runtime. With a release tag it also
# packages the build (tools/xbox/package_release.py) and publishes a GitHub
# release under that tag.
name: build

# Manual runs only.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish (e.g. v1); empty = build and test only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xbe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM: /home/runner/toolchain/llvm21
      NXDK_DIR: /home/runner/toolchain/nxdk
      DISC_LOWER: /home/runner/toolchain/disc_lower
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential cmake ninja-build git bison flex \
            libzstd-dev zlib1g-dev libxml2-dev python3-pip
          pip install --user --break-system-packages nv2a-vsh pillow

      # LLVM and nxdk take most of the time; they only change with setup.sh
      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/toolchain/llvm21
            /home/runner/toolchain/nxdk
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/xbox/setup.sh') }}

      - name: Toolchain
        run: tools/xbox/setup.sh

      # ThinLTO + PGO with the committed profile (docs/pgo.md): console
      # rounds 2-6 (docs/fps-plan.md), +13% on Fountain 4-CPU at 720p
      - name: Build default.xbe
        env:
          XBOX_LTO: "1"
          XBOX_PGO: xbox/melee.profdata
        run: xbox/build.sh

      # $$XTIMAGE section, title ID 4D580001 and default.tbn (as tools/xbox/docker/build.sh does)
      - name: Dashboard icon
        run: python3 tools/xbox/xbe_title_image.py build-xbox/xbe/default.xbe xbox/assets/logo.png build-xbox/xbe/default.tbn

      - name: Tests
        run: |
          python3 tools/lower/test_lower.py
          python3 tools/xbox/test_vp_encoder.py
          python3 tools/xbox/test_vp_opt.py
          python3 tools/xbox/vp_policy.py --check
          python3 tools/xbox/test_tex_convert.py
          python3 tools/xbox/test_fog.py
          python3 tools/xbox/test_rc.py
          python3 tools/xbox/test_anim_mtx.py
          python3 tools/xbox/test_pobj_mtx.py
          python3 tools/xbox/test_tex_cache.py
          python3 tools/xbox/test_dl_cull.py
          python3 tools/xbox/test_audio_mix.py
          python3 tools/xbox/test_mplib.py
          python3 tools/xbox/test_card_endian.py

      - uses: actions/upload-artifact@v4
        with:
          name: default.xbe
          path: |
            build-xbox/xbe/default.xbe
            build-xbox/melee_x.map
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          python3 tools/xbox/package_release.py "$TAG"
          gh release create "$TAG" "dist/Melee-X-$TAG.zip" --target "$GITHUB_SHA" \
            --title "Melee-X $TAG" --notes-file .github/release-notes.md
